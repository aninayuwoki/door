<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Door Widget</title>
<link rel="stylesheet" href="styles/style.css">
<link rel="manifest" href="manifest.json"> <!-- Added manifest link -->
</head>
<body>
    <div id="config-container">
        <h2>Configuración de Usuario</h2>
        <label for="userId-input">User ID:</label>
        <input type="text" id="userId-input" placeholder="Ingresa tu User ID" />
        <br>
        <label for="code-input">Code:</label>
        <input type="text" id="code-input" placeholder="Ingresa tu Code" />
        <br>
        <button id="save-config-button">Guardar</button>
    </div>

<!-- Botón para presionar la puerta -->
<!-- Removed duplicate button to fix HTML validation and potential JS issues -->
  <div class="widget-container">
    <button id="door-button">Tocar la Puerta</button> 
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="scripts/utils.js"></script> <!-- utils.js loaded before main.js -->
  <script src="scripts/main.js"></script>
  <!-- <script src="scripts/geolocation.js"></script> Removed, functionality in main.js -->
  <!-- <script src="scripts/notifications.js"></script> Removed, functionality in utils.js -->

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').then(registration => {
          console.log('ServiceWorker registration successful with scope: ', registration.scope);
        }, err => {
          console.log('ServiceWorker registration failed: ', err);
        });
      });
    }
  </script>
</body>
</html>
